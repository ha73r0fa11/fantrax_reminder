services:
  fantrax-bot:
    build: .
    env_file: .env
    environment:
      - STATE_FILE=/data/state.json
      - MAPPING_FILE=/data/mapping.json
      - PARTICIPANTS_FILE=/data/participants.json
    volumes:
      # state.json, mapping.json и participants.json живут здесь же на сервере.
      - ./data:/data
    restart: unless-stopped
