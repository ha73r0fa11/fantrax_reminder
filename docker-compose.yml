services:
  fantrax-bot:
    build: .
    env_file: .env
    environment:
      - STATE_FILE=/data/state.json
      - MAPPING_FILE=/data/mapping.json
    volumes:
      - bot-data:/data
      # Файл привязки редактируется на сервере рядом с docker-compose.yml.
      - ./mapping.json:/data/mapping.json:ro
    restart: unless-stopped

volumes:
  bot-data:
